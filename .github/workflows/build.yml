name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded project
        run: |
          mkdir -p /tmp/iptv-build
          unzip -q total-iptv-updated-project.zip -d /tmp/iptv-build
          test -f /tmp/iptv-build/app/build.gradle
          test -s /tmp/iptv-build/app/src/main/res/raw/channels.m3u
          ls -lh /tmp/iptv-build/app/src/main/res/raw/channels.m3u

      - name: Build APK
        run: |
          cd /tmp/iptv-build
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: total-APK
          path: /tmp/iptv-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
